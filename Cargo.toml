[package]
name = "otto"
version = "0.1.0"
edition = "2021"
description = "Ollama TUI chat with web search and cht.sh"

[dependencies]
ratatui = "0.30"

crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13", features = ["json", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
anyhow = "1"
dirs = "6"
toml = "0.8"
syntect = "5.3.0"
fuzzy-matcher = "0.3.7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
